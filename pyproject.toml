[project]
name = "indextts25-inference"
version = "0.1.1"
description = "IndexTTS-2.5 inference library: zero-shot TTS with emotion, speed and streaming control"
readme = "README.md"
authors = [{ name = "Bilibili IndexTTS Team" }]
maintainers = [{ name = "Kimox" }]
license = "LicenseRef-Bilibili-IndexTTS"
license-files = ["LICEN[CS]E*"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.8",
  "transformers>=4.52",
  "huggingface_hub>=0.30",
  "tiktoken>=0.7",
  "librosa>=0.10",
  "omegaconf>=2.3",
  "pyyaml>=5.1",  # optional glossary.yaml in the model_dir
  "safetensors>=0.4.3",
  "einops>=0.8",
  "numpy>=1.26",
  # Normalizes numbers, dates and times in Spanish (and en/zh without the [zh] extra).
  # Upstream does not declare it, and without it numbers reach the tokenizer raw. Its exact
  # pynini pin only has x86_64 wheels up to CPython 3.13; otherwise, see the README.
  "nemo-text-processing>=1.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.14'",
]

[project.optional-dependencies]
# Accelerated GPT2 engine (paged KV cache + CUDA graphs). The flash-attn wheel depends on
# torch and CUDA and is best installed BEFORE this extra; otherwise pip compiles it. See README.
flash = ["flash-attn>=2.8.3", "triton>=3.0"]
# zh/en normalization with WeTextProcessing; without this extra, en/zh use NeMo.
zh = ["WeTextProcessing>=1.2; sys_platform == 'linux'", "wetext>=0.1; sys_platform != 'linux'"]
ja = ["fugashi>=1.2", "unidic-lite>=1.0"]

[dependency-groups]
dev = ["ruff>=0.11"]
test = ["pytest>=8", "pytest-cov>=6"]

[project.urls]
Homepage = "https://github.com/nicokim/indextts25-inference"
Upstream = "https://github.com/index-tts/index-tts"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indextts25"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "E402"]
